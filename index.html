<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Kash ❤️</title>
<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family: Arial, sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

h1{
    color:white;
    font-size:42px;
    text-shadow:2px 2px 8px rgba(0,0,0,0.3);
}

button{
    padding:15px 35px;
    font-size:22px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    position:absolute;
}

#yes{
    background:#ff4d6d;
    color:white;
    left:40%;
    top:60%;
}

#no{
    background:white;
    color:#ff4d6d;
    left:55%;
    top:60%;
}

#celebrate{
    position:fixed;
    inset:0;
    background:white;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:40px;
}
</style>
</head>

<body>

<h1>Kash, will you be my Valentine? 💖</h1>

<button id="yes">Yes ❤️</button>
<button id="no">No 😢</button>

<div id="celebrate">
    💖 💕 💗 💓 💞<br><br>
    You just made me the happiest person alive! 😍
</div>

<script>
const noBtn = document.getElementById("no");

function moveNo(){
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("click", moveNo);

document.getElementById("yes").onclick = () =>{
    document.getElementById("celebrate").style.display="flex";
}
</script>

</body>
</html>
