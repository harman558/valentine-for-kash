<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Kash ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:'Comic Sans MS', cursive;
    overflow:hidden;
    text-align:center;
}

.container{
    position:relative;
}

h1{
    font-size:42px;
    color:white;
    margin-bottom:60px;
    text-shadow:2px 2px 10px #ff4d6d;
}

button{
    padding:18px 45px;
    font-size:24px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    position:absolute;
    transition:all 0.25s ease;
}

#yes{
    background:#ff4d6d;
    color:white;
    left:40%;
}

#no{
    background:white;
    color:#ff4d6d;
    left:60%;
}

.celebrate{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:50px;
    color:#ff4d6d;
    display:none;
}
</style>
</head>

<body>

<div class="container">
    <h1>Kash, will you be my Valentine? 💖</h1>
    <button id="yes">YES 💘</button>
    <button id="no">NO 🙈</button>
</div>

<div class="celebrate" id="celebrate">
    🎉 YAYYY!!! 🎉<br>
    I knew you'd say YES Kash ❤️
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const celebrate = document.getElementById("celebrate");

// Make NO run away every time
function moveNo(){
    const x = Math.random() * (window.innerWidth - 150);
    const y = Math.random() * (window.innerHeight - 100);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("click", moveNo);

// Celebration on YES
yesBtn.addEventListener("click", () => {
    celebrate.style.display = "flex";
});
</script>

</body>
</html>
